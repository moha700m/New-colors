name: Windows Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o dist/MohammedLab-ColorVision
      - uses: actions/upload-artifact@v4
        with:
          name: MohammedLab-ColorVision-win-x64
          path: dist/MohammedLab-ColorVision
